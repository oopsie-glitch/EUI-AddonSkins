name: AtlasLoot Classic mode validation
on:
  push:
    branches: [skin/atlasloot-classic-only]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Inspect exact uploaded source
        run: python3 scripts/inspect_atlasloot_source.py
      - name: Install hosted Lua
        run: sudo apt-get update -qq && sudo apt-get install -y liblua5.4-0
      - name: Validate regressions and package
        run: python3 scripts/package.py
