name: Release 1.6.8 combined verification
on:
  push:
    branches: [release/1.6.8]
permissions:
  contents: read
concurrency:
  group: release-1.6.8-qa
  cancel-in-progress: true
jobs:
  combined:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install hosted test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y liblua5.4-0 python3-cairosvg python3-pil
      - name: Verify licensed toolbar assets
        run: python3 scripts/build_details_native_media.py
      - name: Complete combined regression and package checks
        run: |
          python3 scripts/package.py
          python3 scripts/check_release_1_6_8.py
      - name: Native sources, persistence, combat, ownership and performance
        run: python3 scripts/verify_release_sources.py
