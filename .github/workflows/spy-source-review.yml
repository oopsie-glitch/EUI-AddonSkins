name: Spy upstream source review
on:
  push:
    branches: [skin/spy-forever]
    paths: [.github/workflows/spy-source-review.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Inspect official Spy Forever source without redistributing it
        run: |
          python3 - <<'PY'
          import urllib.request, zipfile, io, hashlib
          url='https://edge.forgecdn.net/files/9501/070/Spy-1.3.8-forever5.zip'
          data=urllib.request.urlopen(url).read()
          print('SOURCE SHA256',hashlib.sha256(data).hexdigest())
          z=zipfile.ZipFile(io.BytesIO(data))
          print('FILES',z.namelist())
          for name in z.namelist():
              if name.rsplit('/',1)[-1] in ('MainWindow.lua','Widgets.lua','Colors.lua','SpyStats.lua','SpyStats.xml','Spy.toc','List.lua'):
                  print('SOURCE-BEGIN '+name)
                  print(z.read(name).decode('utf-8-sig',errors='replace'))
                  print('SOURCE-END '+name)
          PY
