name: Spy Forever test package
on:
  push:
    branches: [skin/spy-forever]
permissions:
  contents: read
  actions: read
concurrency:
  group: spy-test-package
  cancel-in-progress: true
jobs:
  test-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install Lua runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y liblua5.4-0
      - name: Full regressions and installation ZIP
        run: python3 scripts/package.py
      - name: Verify actual official Spy Forever row constructors and updates
        run: |
          python3 - <<'PY'
          import urllib.request, io, zipfile, hashlib
          from pathlib import Path
          data=urllib.request.urlopen('https://edge.forgecdn.net/files/9501/070/Spy-1.3.8-forever5.zip').read()
          assert hashlib.sha256(data).hexdigest()=='f0373e3cb8a31864d41532e08fb5748f42f0a76f45b2c4c9b0bbd92efe14fbec'
          z=zipfile.ZipFile(io.BytesIO(data))
          import re
          print('SPY NATIVE ROW LIFECYCLE BEGIN')
          native_rows=z.read('Spy/MainWindow.lua').decode('utf-8-sig')
          for name in ('CreateRow','SetupBar','SetBar','ResizeMainWindow','ManageBarsDisplayed'):
              marker='function Spy:'+name+'('
              start=native_rows.index(marker)
              end=native_rows.find('\nfunction ',start+len(marker))
              print(native_rows[start:end if end>=0 else None])
          print('SPY NATIVE ROW LIFECYCLE END')
          print('SPY NATIVE HEADER GEOMETRY BEGIN')
          native=z.read('Spy/MainWindow.lua').decode('utf-8-sig')
          for number,line in enumerate(native.splitlines(),1):
              if re.search(r'(?:CloseButton|RightButton|LeftButton|ClearButton|StatsButton|CountButton).*Set(?:Width|Height|Point)|function Spy:SetupMainWindowButtons|Spy.MainWindow\[k\]:SetWidth',line):
                  print(str(number)+': '+line)
          print('SPY NATIVE HEADER GEOMETRY END')
          print('SPY BACKGROUND SOURCE AUDIT BEGIN')
          for member in ('Spy/Widgets.lua','Spy/Colors.lua'):
              print('REVIEW FILE '+member)
              for number,line in enumerate(z.read(member).decode('utf-8-sig').splitlines(),1):
                  print(str(number)+': '+line)
          print('SPY BACKGROUND SOURCE AUDIT END')
          print('FOREVER UI OVERRIDES BEGIN')
          for member in ('Spy/Forever.lua','Spy/Watch.lua'):
              lines=z.read(member).decode('utf-8-sig',errors='replace').splitlines()
              selected=set()
              for i,line in enumerate(lines):
                  if re.search(r'(CreateMainWindow|CreateRow|SetupBar|SetBar\b|SetupMainWindowButtons|BarDropDown|ShowStatsDropDown|UpdateMainWindow|UpdateAlertWindow|WatchMainWindow|AlertWatch|ShowAlert)',line):
                      selected.update(range(max(0,i-4),min(len(lines),i+65)))
              print('REVIEW FILE '+member)
              for i in sorted(selected): print(str(i+1)+': '+lines[i])
          print('FOREVER UI OVERRIDES END')
          print('UPSTREAM UI SURFACE INVENTORY')
          for member in z.namelist():
              if member.count('/')==1 and member.endswith('.lua'):
                  for number,line in enumerate(z.read(member).decode('utf-8-sig',errors='replace').splitlines(),1):
                      if re.search(r'(CreateFrame\(|StaticPopupDialogs\[|function Spy:\w*(?:Window|Alert|DropDown|Config))',line):
                          print(member.rsplit('/',1)[-1]+':'+str(number)+': '+line.strip())
          for name in ('Colors.lua','Widgets.lua','MainWindow.lua'):
              path=Path('/tmp/spy-upstream')/name
              path.parent.mkdir(parents=True,exist_ok=True)
              path.write_bytes(z.read('Spy/'+name))
          PY
          SPY_SOURCE=/tmp/spy-upstream python3 tests/run_lua.py
      - name: Fresh Lua bootstrap with saved Spy opacity endpoints
        run: |
          SPY_BOOT_OPACITY=0 python3 tests/run_lua.py
          SPY_BOOT_OPACITY=0.75 python3 tests/run_lua.py
          SPY_BOOT_OPACITY=1 python3 tests/run_lua.py
      - name: Verify regression sensitivity for default opacity and header separation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess, sys
          path=Path('EUIAddonSkins/Skins/Spy.lua')
          original=path.read_text()
          mutations=[
              ('local gap = number > 1 and math.min(2, math.max(0, (width - 11 - total) / (number - 1))) or 0', 'local gap = number > 1 and math.max(0, (width - 16 - total) / (number - 1)) or 0', 'hidden control broke compact right alignment'),
              ('local offset = contentLeft', 'local offset = (width - total - gap * math.max(0, number - 1)) / 2', 'toolbar is not right aligned'),
              ('return 0.75', 'return 0.92', 'saved/default opacity was overwritten'),
              ('local dividerY = controlY + tallest / 2 + 1', 'local dividerY = controlY + tallest / 2 + 8', 'header gap is not compact'),
              ('if managed then plate:SetColorTexture(1, 1, 1, 1)', 'if managed then plate:SetColorTexture(0.165, 0.115, 0.075, 1)', 'main plate source repeats the warm tint'),
              ('paint.low:SetRGBA(0.120, 0.084, 0.055, plateAlpha)', 'paint.low:SetRGBA(0.120, 0.084, 0.055, 1)', 'gradient stops retain opaque paint'),
              ('if entry.band:IsShown() then entry.band:Hide() end', 'if entry.band:IsShown() then Alpha(entry.band, 0) end', 'stacked opaque header fill retained'),
          ]
          try:
              for before,after,message in mutations:
                  assert original.count(before)==1
                  path.write_text(original.replace(before,after))
                  result=subprocess.run([sys.executable,'tests/run_lua.py'],capture_output=True,text=True)
                  assert result.returncode!=0 and message in result.stdout+result.stderr, result.stdout+result.stderr
                  print('VERIFIED regression sensitivity:',message)
          finally:
              path.write_text(original)
          assert path.read_text()==original
          PY
      - name: Verify clean install artifact and unchanged release metadata
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import hashlib
          z=ZipFile('EUIAddonSkins-1.6.5.zip')
          assert z.testzip() is None and len(z.namelist())==66
          assert {p.split('/')[0] for p in z.namelist()}=={'EUIAddonSkins'}
          expected={p.as_posix() for p in Path('EUIAddonSkins').rglob('*')
                    if p.is_file() and p.name not in ('README.md','CHANGELOG.md')}
          assert set(z.namelist())==expected
          assert z.read('EUIAddonSkins/LICENSE')==Path('LICENSE').read_bytes()
          for name in z.namelist(): assert z.read(name)==Path(name).read_bytes()
          assert 'ns.VERSION = "1.6.5"' in Path('EUIAddonSkins/Core.lua').read_text()
          for flavor in ('','_Camelot','_Mainline'):
              assert '## Version: 1.6.5' in Path('EUIAddonSkins/EUIAddonSkins'+flavor+'.toc').read_text()
          z.extractall('/tmp/spy-test-package')
          digest=hashlib.sha256(Path('EUIAddonSkins-1.6.5.zip').read_bytes()).hexdigest()
          print('VERIFIED: 66 source-matching runtime files; one addon folder; no development/upstream files')
          print('CLOUD ZIP SHA256:',digest)
          PY
      - name: Upload installable test ZIP (not a release)
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: EUIAddonSkins-Spy-Forever-${{ github.sha }}-test
          path: /tmp/spy-test-package/
          retention-days: 30
          if-no-files-found: error
      - name: Verify downloadable artifact bytes and installation root
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: oopsie-glitch/EUI-AddonSkins
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
        run: |
          gh api repos/$GH_REPO/actions/artifacts/$ARTIFACT_ID/zip > /tmp/spy-downloadable-test.zip
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import hashlib
          data=Path('/tmp/spy-downloadable-test.zip').read_bytes()
          with ZipFile('/tmp/spy-downloadable-test.zip') as z:
              assert z.testzip() is None and len(z.namelist())==66
              assert {p.split('/')[0] for p in z.namelist()}=={'EUIAddonSkins'}
              for name in z.namelist():
                  assert z.read(name)==Path(name).read_bytes()
              assert z.read('EUIAddonSkins/LICENSE')==Path('LICENSE').read_bytes()
          print('VERIFIED DOWNLOAD: installable artifact ZIP, 66 source-identical files, one EUIAddonSkins folder')
          print('DOWNLOADABLE ARTIFACT SHA256:',hashlib.sha256(data).hexdigest())
          PY
