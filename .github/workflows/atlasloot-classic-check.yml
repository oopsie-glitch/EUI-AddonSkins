name: AtlasLoot Classic mode validation
on:
  push:
    branches: [skin/atlasloot-classic-only]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      artifact_id: ${{ steps.package.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install hosted Lua
        run: sudo apt-get update -qq && sudo apt-get install -y liblua5.4-0
      - name: Verify exact 13014 source, lifecycle, baseline failure and performance
        run: python3 scripts/inspect_atlasloot_source.py
      - name: Validate complete regressions and package
        run: python3 scripts/package.py
      - name: Stage installable folder
        run: |
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile('EUIAddonSkins.zip') as z:
              z.extractall('/tmp/atlasloot-install')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        id: package
        with:
          name: EUIAddonSkins-AtlasLoot-${{ github.sha }}
          path: /tmp/atlasloot-install/
          retention-days: 14
  verify:
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ needs.validate.outputs.artifact_id }}
          github-token: ${{ github.token }}
          path: /tmp/atlasloot-verify
          merge-multiple: true
      - name: Verify exact runtime bytes and exclusions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root=Path('/tmp/atlasloot-verify')
          assert {p.name for p in root.iterdir()}=={'EUIAddonSkins'}
          files=[p for p in root.rglob('*') if p.is_file()]
          assert len(files)==82
          for p in files:
              assert p.read_bytes()==Path(p.relative_to(root)).read_bytes()
          assert not any(p.suffix=='.zip' or p.name.startswith('.') for p in files)
          print('Verified 82 runtime files against exact candidate; no upstream or development files')
          PY
