name: DBM secret visibility checks
on:
  push:
    branches: [skin/dbm-secret-visibility]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      artifact_id: ${{ steps.package.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install hosted Lua
        run: sudo apt-get update -qq && sudo apt-get install -y liblua5.4-0
      - name: Check pinned upstream contracts
        run: python3 scripts/check_dbm_secret.py --sources
      - name: Demonstrate regression sensitivity against v1.6.8
        run: python3 scripts/check_dbm_secret.py --baseline
      - name: Validate complete candidate
        run: python3 scripts/package.py
      - name: Benchmark baseline and candidate
        run: python3 scripts/check_dbm_secret.py --benchmark
      - name: Stage installable folder
        run: |
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile('EUIAddonSkins.zip') as z:
              z.extractall('/tmp/dbm-install')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        id: package
        with:
          name: EUIAddonSkins-DBM-${{ github.sha }}
          path: /tmp/dbm-install/
          retention-days: 14
  verify:
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ needs.test.outputs.artifact_id }}
          github-token: ${{ github.token }}
          path: /tmp/dbm-verify
          merge-multiple: true
      - name: Verify transferred runtime bytes and package exclusions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root=Path('/tmp/dbm-verify')
          assert {p.name for p in root.iterdir()} == {'EUIAddonSkins'}
          files=[p for p in root.rglob('*') if p.is_file()]
          assert len(files)==82
          assert all(p.read_bytes()==Path(p.relative_to(root)).read_bytes() for p in files)
          assert not any(p.suffix=='.zip' or p.name.startswith('.') for p in files)
          print('Verified 82 runtime files against exact candidate checkout; no development files')
          PY
