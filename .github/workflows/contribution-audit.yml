name: Hunter guide ownership and retention review
on:
  push:
    branches: [fix/huntersfieldguide-theme-lifecycle]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install Lua test runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y liblua5.4-0
      - name: Complete existing regressions and package validation
        run: python3 scripts/package.py
      - name: Inspect authoritative reviewed-version history
        run: python3 scripts/check_hfg_reviewed_source.py
      - name: Trace source-owned text structures and construction lifecycle
        run: python3 scripts/inspect_hfg_text_roles.py
      - name: Verify actual source ownership contracts and known failing cases
        run: python3 scripts/check_hfg_accent_ownership.py
      - name: Five-trial baseline and prior-prototype performance review
        run: python3 benchmarks/contributions.py
      - name: Checkout exact current main for combined compatibility
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 82eb4fd5dc22a4bc973b9c47739d40a912f57c26
          path: combined-main
          persist-credentials: false
      - name: Validate current-main compatibility without changing unrelated integrations
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess,sys
          for name in ('EUIAddonSkins/Skins/HuntersFieldGuide.lua','tests/huntersfieldguide_spec.lua'):
              Path('combined-main',name).write_bytes(Path(name).read_bytes())
          subprocess.run([sys.executable,'scripts/package.py'],cwd='combined-main',check=True)
          print('Combined current-main validation: only HFG runtime/test overlaid; ItemTree and shared infrastructure unchanged.')
          PY
