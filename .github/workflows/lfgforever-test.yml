name: LFG Forever source and test package
on:
  push:
    branches: [skin/lfgforever-standard]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Inspect verified archive structure without source output
        run: python3 scripts/inspect_lfgforever.py
