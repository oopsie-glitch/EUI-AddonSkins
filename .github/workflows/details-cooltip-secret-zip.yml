name: Validate and package Details Cooltip fix
on:
  push:
    branches: [test/details-cooltip-secret-zip]
    paths: [.github/workflows/details-cooltip-secret-zip.yml]
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      DETAILS_COOLTIP_SOURCE_FIXTURE: /tmp/details-cooltip-source.lua
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: f28ada14300cd075ba859bb751d0514402aa7d9e
          persist-credentials: false
      - name: Install Lua and prepare pinned Forever and DetailsFramework source fixture
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y liblua5.4-0
          python3 - <<'PY'
          from pathlib import Path
          from urllib.request import urlopen
          import re

          def read(repo, sha, path):
              with urlopen(f'https://raw.githubusercontent.com/{repo}/{sha}/{path}', timeout=30) as response:
                  return response.read().decode('utf-8-sig').replace(chr(13), '')

          upstream = 'Tercioo/Details-Damage-Meter'
          details = '4316feb434bcc9751455ae2c6435d93fc20f034f'
          forever = 'bebcb6bf309cf41b41bd74f8ca651e6a105b2676'
          df = read(upstream, details, 'Libs/DF/fw.lua')
          cooltip = read(upstream, details, 'Libs/DF/cooltip.lua')
          main = read(upstream, details, 'frames/window_main.lua')
          backdrop = read('Gethe/wow-ui-source', forever, 'Interface/AddOns/Blizzard_SharedXML/Backdrop.lua')
          fade = re.search(r'^function DF:FadeFrame\(frame, t\)\n.*?^end$', df, re.M | re.S).group()
          coordinates = re.search(r'^function BackdropTemplateMixin:SetupTextureCoordinates\(\)\n.*?^end$', backdrop, re.M | re.S).group()
          coord_start = re.search(r'^local coordStart\s*=\s*([^;\n]+)', backdrop, re.M).group(1)
          assert 'frame:SetAlpha(0)' in fade and 'frame:Hide()' in fade
          assert 'DF:FadeFrame(frame1, 1)' in cooltip and 'gameCooltip.Host = nil' in cooltip
          assert 'not issecretvalue(frame:GetWidth()) and not issecretvalue(frame:GetHeight())' in cooltip
          assert 'GameCooltip:Hide()' in main
          fixture = ('local DF, BackdropTemplateMixin = {}, {}\n'
                     'local max, textureUVs = math.max, {}\n'
                     f'local coordStart = {coord_start}\n'
                     f'{fade}\n{coordinates}\n'
                     'return DF.FadeFrame, BackdropTemplateMixin.SetupTextureCoordinates\n')
          Path('/tmp/details-cooltip-source.lua').write_text(fixture)
          print('Pinned native source verified:', details, forever)
          PY
      - name: Run full regression and verify install ZIP
        run: python3 scripts/package.py
      - name: Confirm the pre-fix skin fails the same secret-width regression
        run: |
          cp EUIAddonSkins/Skins/Details.lua /tmp/details-fixed.lua
          trap 'cp /tmp/details-fixed.lua EUIAddonSkins/Skins/Details.lua' EXIT
          curl -fsSL "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/3553aca8e386c77be2c1af20a719117c14199df2/EUIAddonSkins/Skins/Details.lua" -o EUIAddonSkins/Skins/Details.lua
          if python3 tests/run_lua.py > /tmp/details-baseline.log 2>&1; then
            echo "Baseline unexpectedly passed"
            exit 1
          fi
          grep -F 'attempt to divide secret tooltip width' /tmp/details-baseline.log
      - name: Prepare installable folder
        run: python3 -m zipfile -e EUIAddonSkins.zip /tmp/details-cooltip-install
      - name: Upload the verified test ZIP
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: EUIAddonSkins-Details-Cooltip-f28ada14
          path: /tmp/details-cooltip-install/
          retention-days: 30
          if-no-files-found: error
      - name: Check compatibility with the exact toolbar-sizing draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -H 'Accept: application/vnd.github.diff' "repos/$GITHUB_REPOSITORY/commits/9dfee943a69800f873f27525e0ed1453b8a6fc62" > /tmp/toolbar.diff
          git apply --3way /tmp/toolbar.diff
          python3 scripts/package.py
