name: Settings and Spy integration test package
on:
  push:
    branches: [test/settings-spy-integration]
permissions:
  contents: read
  actions: read
concurrency:
  group: settings-spy-integration-test-package
  cancel-in-progress: true
jobs:
  test-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install Lua test runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y liblua5.4-0
      - name: Compare settings artwork and navigation on one runner
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from statistics import median
          from subprocess import check_output
          from urllib.request import urlopen
          import re
          import sys

          baseline = 'https://raw.githubusercontent.com/oopsie-glitch/EUI-AddonSkins/7969b352a23aed96d87b23cb7d12419e6b20fef9/'
          renderer = Path('EUIAddonSkins/SettingsUI.lua')
          fixture = Path('tests/settings_ui_spec.lua')
          candidate_source = renderer.read_bytes()
          candidate_fixture = fixture.read_bytes()

          def read_baseline(path):
              with urlopen(baseline + str(path), timeout=30) as response:
                  return response.read()

          before_source = read_baseline(renderer)
          original_fixture = read_baseline(fixture)
          measurements = {'before': [], 'after': []}
          pattern = re.compile(r'BENCH (Skin Style dropdown|Combined Spy/RestedXP): '
                               r'(\d+) frames/(\d+) regions settled, 200 .* cycles ([\d.]+) ms')
          try:
              # Keep instrumentation and workloads identical across both renderers.
              fixture.write_bytes(original_fixture)
              for trial in range(5):
                  pair = [('before', before_source), ('after', candidate_source)]
                  for label, source in pair if trial % 2 == 0 else reversed(pair):
                      renderer.write_bytes(source)
                      output = check_output([sys.executable, 'tests/run_lua.py'], text=True)
                      rows = pattern.findall(output)
                      assert len(rows) == 2, output
                      measurements[label].append(rows)
                      print(label, trial + 1, rows, flush=True)
          finally:
              renderer.write_bytes(candidate_source)
              fixture.write_bytes(candidate_fixture)

          for label, samples in measurements.items():
              for index, (name, frames, regions, _) in enumerate(samples[0]):
                  assert all(rows[index][:3] == (name, frames, regions) for rows in samples)
                  duration = median(float(rows[index][3]) for rows in samples)
                  print(f'PAIRED SETTINGS {label}: {name}: {frames} frames/{regions} regions, '
                        f'{duration:.3f} ms median of five 200-cycle trials')
          PY
      - name: Validate and build installation ZIP
        run: python3 scripts/package.py
      - name: Verify against pinned official Spy Forever source
        run: |
          python3 - <<'PY'
          from hashlib import sha256
          from io import BytesIO
          from pathlib import Path
          from urllib.request import urlopen
          from zipfile import ZipFile

          url = 'https://edge.forgecdn.net/files/9501/070/Spy-1.3.8-forever5.zip'
          with urlopen(url, timeout=30) as response:
              data = response.read()
          assert sha256(data).hexdigest() == 'f0373e3cb8a31864d41532e08fb5748f42f0a76f45b2c4c9b0bbd92efe14fbec'
          root = Path('/tmp/spy-upstream')
          members = (
              'Spy.lua', 'MainWindow.lua', 'Colors.lua', 'Widgets.lua',
              'Libs/AceGUI-3.0/AceGUI-3.0.lua',
              'Libs/AceGUI-3.0-SharedMediaWidgets/prototypes.lua',
              'Libs/AceGUI-3.0-SharedMediaWidgets/StatusbarWidget.lua',
          )
          with ZipFile(BytesIO(data)) as source:
              for member in members:
                  destination = root / member
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  destination.write_bytes(source.read('Spy/' + member))
          PY
          export SPY_SOURCE=/tmp/spy-upstream
          python3 tests/run_lua.py
          SPY_BOOT_INVERTED=1 python3 tests/run_lua.py
          SPY_BOOT_STANDARD_INVERTED=1 python3 tests/run_lua.py
      - name: Verify fresh bootstrap with saved Spy opacity
        run: |
          for opacity in 0 0.75 1; do
            SPY_BOOT_OPACITY="$opacity" python3 tests/run_lua.py
          done
      - name: Prepare addon-only test artifact
        run: python3 -m zipfile -e EUIAddonSkins.zip /tmp/settings-spy-integration
      - name: Store temporary Actions artifact
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: EUIAddonSkins-Settings-Spy-${{ github.sha }}-test
          path: /tmp/settings-spy-integration/
          retention-days: 30
          if-no-files-found: error
      - name: Verify downloaded artifact against the validated installation ZIP
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
        run: |
          for attempt in 1 2 3 4 5; do
            if gh api "repos/$GH_REPO/actions/artifacts/$ARTIFACT_ID/zip" > /tmp/settings-spy-integration-download.zip; then break; fi
            if [ "$attempt" -eq 5 ]; then exit 1; fi
            sleep 3
          done
          python3 - <<'PY'
          from hashlib import sha256
          from pathlib import Path
          from zipfile import ZipFile
          path = Path('/tmp/settings-spy-integration-download.zip')
          with ZipFile(path) as actual, ZipFile('EUIAddonSkins.zip') as expected:
              assert actual.testzip() is None
              assert sorted(actual.namelist()) == sorted(expected.namelist())
              assert all(actual.read(name) == expected.read(name) for name in expected.namelist())
              assert {name.split('/')[0] for name in actual.namelist()} == {'EUIAddonSkins'}
              print('Verified install artifact:', len(actual.namelist()), 'runtime files; one EUIAddonSkins folder')
          print('Install artifact SHA256:', sha256(path.read_bytes()).hexdigest())
          PY
