name: Contribution performance audit
on:
  push:
    branches: [fix/contributed-skin-audit]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install Lua test runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y liblua5.4-0
      - name: Full regressions and installation package
        run: python3 scripts/package.py
      - name: Five-trial source-shaped contribution audit
        run: python3 benchmarks/contributions.py
      - name: Independently verify late native accent labels
        run: python3 benchmarks/check_hfg_late_accent.py
