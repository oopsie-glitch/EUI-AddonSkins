name: Reconstruct Guildy contribution
on:
  push:
    branches: [test/release-1.6.7-validation]
permissions:
  contents: write
jobs:
  reconstruct:
    runs-on: ubuntu-24.04
    steps:
      - name: Create and verify attributed commit through GitHub REST
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh api "repos/$GH_REPO/git/commits/a0d97a83ba7a654790a7381d3d898a8ef31cc78d" | jq --arg tree '8bbbd70451092d6f6cd279710ea30dc1ec38f342' '
            {message: "Guildy: refine the native banner proportions\n\nReconstructed from a0d97a83ba7a654790a7381d3d898a8ef31cc78d with the client-native border and without bundled artwork.", tree: $tree, parents: [.parents[0].sha], author: (.author | {name,email,date})}
          ' > "$RUNNER_TEMP/commit.json"
          sha=$(gh api "repos/$GH_REPO/git/commits" --input "$RUNNER_TEMP/commit.json" --jq .sha)
          test "$(gh api "repos/$GH_REPO/commits/$sha" --jq .author.login)" = goldenpipes
          for field in name email date; do
            test "$(gh api "repos/$GH_REPO/git/commits/$sha" --jq ".author.$field")" = "$(jq -r ".author.$field" "$RUNNER_TEMP/commit.json")"
          done
          echo "Verified reconstructed Guildy commit: $sha"
