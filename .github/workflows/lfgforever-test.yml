name: LFG Forever source and test package
on:
  push:
    branches: [skin/lfgforever-standard]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Inspect verified archive structure without source output
        run: python3 scripts/inspect_lfgforever.py
      - name: Validate pinned native UI contracts
        run: python3 scripts/check_lfgforever_source.py
      - name: Install Lua runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y liblua5.4-0
      - name: Complete regressions and package validation
        run: python3 scripts/package.py
