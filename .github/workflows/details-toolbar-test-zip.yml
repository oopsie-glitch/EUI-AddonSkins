name: Details toolbar test ZIP
on:
  push:
    branches: [test/details-native-toolbar-zip]
    paths: [.github/workflows/details-toolbar-test-zip.yml]
permissions:
  contents: read
  actions: read
jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 9dfee943a69800f873f27525e0ed1453b8a6fc62
          persist-credentials: false
      - name: Validate and build install package
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y liblua5.4-0
          python3 scripts/package.py
          python3 -m zipfile -e EUIAddonSkins.zip /tmp/details-install
      - name: Store the installable ZIP
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: EUIAddonSkins-Details-PR87-9dfee94
          path: /tmp/details-install/
          retention-days: 30
          if-no-files-found: error
      - name: Verify downloadable ZIP contents
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" > /tmp/details-download.zip
          python3 - <<'PY'
          from zipfile import ZipFile
          with ZipFile('/tmp/details-download.zip') as actual, ZipFile('EUIAddonSkins.zip') as expected:
              files = [item.filename for item in actual.infolist() if not item.is_dir()]
              assert actual.testzip() is None and sorted(files) == sorted(expected.namelist())
              assert all(actual.read(name) == expected.read(name) for name in files)
              print('Verified directly installable artifact with', len(files), 'runtime files')
          PY
